name: CI

on:
    push:
        branches:
            [main]
    pull_request:
        branches:
            [main]
    
jobs:
    build:
        runs-on:
            ubuntu-latest

        steps:
            - name: Descargar el codigo del Repositorio
              uses: actions/checkout@v4

            - name: Instalar Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Instalar dependencias
              run: npm ci

            - name: Revisar el codigo con ESLint
              run: npm run lint

            - name: Comprobar los tipos de TypeScript
              run: npm run typecheck

            - name: Compilar el sitio
              run: npm run build

            - name: Construir la imagen Docker
              run: docker build -t devops-portfolio .

            - name: Verificar que el contenedor levanta ccorrectamente
              run: |
                docker run -d -p 8080:80 --name test-container devops-portfolio
                sleep 3
                curl -f http://localhost:8080 || exit 1
                docker stop test-container