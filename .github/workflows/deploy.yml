name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read     # leer el código del repo
  pages: write       # publicar en GitHub Pages
  id-token: write    # verificar que el despliegue viene de este workflow


concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el sitio
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /devops-portafolio

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar el sitio como artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4