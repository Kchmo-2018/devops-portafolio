name: Deploy to GitHub Pages

# Cuándo corre: cada vez que algo se fusiona a main (CD),
# y también a mano desde la pestaña Actions (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Principio de menor privilegio: el workflow solo recibe los permisos
# que necesita, no el acceso completo por defecto.
permissions:
  contents: read     # leer el código del repo
  pages: write       # publicar en GitHub Pages
  id-token: write    # verificar que el despliegue viene de este workflow

# Si se disparan dos despliegues seguidos, el segundo espera al primero
# en vez de pisarlo. No se cancela el que está en curso para no dejar
# el sitio publicado a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      # src/ contiene archivos de infraestructura (Docker y Nginx) que no
      # forman parte del sitio. Se copian a _site/ solo los archivos
      # publicables, para no exponerlos como descargas públicas.
      - name: Preparar carpeta publicable
        run: |
          mkdir _site
          cp -r src/. _site/
          rm -f _site/Dockerfile _site/nginx.conf _site/.dockerignore
          echo "Archivos que se publicarán:"
          find _site -type f

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar el sitio como artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
